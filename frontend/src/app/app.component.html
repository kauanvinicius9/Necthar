<div class="page">
  <header>
    <h1>Controle de Gastos</h1>
    @if (resume()) {
      <div class="resume">Total gasto: <strong>R$ {{ resume()?.total?.toFixed(2) }}</strong></div>
    }
  </header>

  @if (conectionError()) {
    <p class="alert">Não foi possivel conectar à API</p>
  }

  <main>
    <app-expense-form (expenseCreated)="loadData()"></app-expense-form>
    <app-expense-list [expenses]="expenses()" (deletedExpense)="loadData()"></app-expense-list>
  </main>
</div>
